---
- name: Install Open SSL
  ansible.builtin.apt:
    name: openssl
    state: present
    update_cache: yes

- name: Create directory on CA
  file:
    path: /opt/ca
    state: directory
    mode: '0755'

- name: Generate CA-key
  community.crypto.openssl_privatekey:
    path: /opt/ca/ca.key

- name: Generate CA CSR
  community.crypto.openssl_csr:
    path: /opt/ca/ca.csr
    privatekey_path: /opt/ca/ca.key
    common_name: Lab Internal CA
    organization_name: Lab
    country_name: SE

- name: Create simple self-signed certificate
  community.crypto.x509_certificate:
    path: /opt/ca/ca.crt
    privatekey_path: /opt/ca/ca.key
    csr_path: /opt/ca/ca.csr
    provider: selfsigned

