- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Ensure Nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    
- name: Configure Nginx with HTTPS 
  copy:
    dest: /etc/nginx/sites-enabled/default
    content: |
        server {
          listen 443 ssl;
          server_name webserver.lab.local;

           ssl_certificate     /opt/ca/certificate.crt;
           ssl_certificate_key /opt/ca/webserver.key;

           location / {
            add_header Content-Type text/plain;
            return 200 'Hello from {{ansible_host}} over HTTPS!\nIt appears we have succeeded with what we attempted to do! :D';
          }
        }

  notify: Restart Nginx

