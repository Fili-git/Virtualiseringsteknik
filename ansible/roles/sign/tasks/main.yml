---
- name: Create /opt/ca on Webserver
  file:
    path: /opt/ca
    state: directory
    mode: '0755'
  delegate_to: "{{ item }}"
  loop: "{{ groups['webserver'] }}"

- name: Fetch CSR from Webserver
  fetch:
    src: /opt/ca/webserver.csr
    dest: /tmp/{{ item }}_webserver.csr
    flat: yes
  delegate_to: "{{ item }}"
  loop: "{{ groups['webserver'] }}"

- name: Copy CSR to CA
  copy:
    src: /tmp/{{ item }}_webserver.csr
    dest: /opt/ca/{{ item }}_webserver.csr
    mode: '0644'
  loop: "{{ groups['webserver'] }}"

- name: Sign certificate with our CA
  community.crypto.x509_certificate:        # ← use x509_certificate not _pipe
    path: /opt/ca/{{ item }}_certificate.crt  # writes to file, skips if valid
    csr_path: /opt/ca/{{ item }}_webserver.csr
    provider: ownca
    ownca_path: /opt/ca/ca.crt
    ownca_privatekey_path: /opt/ca/ca.key
    ownca_not_after: +365d
    ownca_not_before: "-1d"
  loop: "{{ groups['webserver'] }}"
  register: certificates

- name: Copy certificate to Webserver
  copy:
    src: /opt/ca/{{ item }}_certificate.crt    # ← read from file on CA
    dest: /opt/ca/certificate.crt
    mode: '0644'
  delegate_to: "{{ item }}"
  loop: "{{ groups['webserver'] }}"